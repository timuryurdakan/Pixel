<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Office — Sprite Önizleme</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231e1e2a'/%3E%3Crect x='1' y='1' width='6' height='4' fill='%233f9a8f'/%3E%3Crect x='2' y='2' width='3' height='1' fill='%23d6fff4'/%3E%3Crect x='3' y='5' width='2' height='1' fill='%236b7180'/%3E%3Crect x='1' y='6' width='6' height='1' fill='%23a0703c'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #1e1e2a; color: #e6e6f0; font: 13px/1.4 monospace; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 20px 0 8px; color: #ffd84a; }
  #status { padding: 6px 10px; border-radius: 4px; display: inline-block; white-space: pre-wrap; }
  #status.ok { background: #234d2a; } #status.bad { background: #5a1f1f; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell span { font-size: 10px; color: #a0a0b8; }
  canvas { image-rendering: pixelated; background: #2c2c3c; }
  .checker { background: repeating-conic-gradient(#3a3a4c 0 25%, #30303f 0 50%) 0 0 / 8px 8px; }
  #scene { background: #000; max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Pixel Office — Sprite Önizleme</h1>
<div id="status">validateSprites()…</div>

<h2>Ofis sahnesi (3×)</h2>
<canvas id="scene"></canvas>

<h2>Animasyonlar (canlı, 4×)</h2>
<div class="grid" id="live"></div>

<h2>Karakter kareleri (4×) — her satır farklı colorSeed</h2>
<div id="chars"></div>

<h2>Zemin / duvar (4×)</h2>
<div class="grid" id="tiles"></div>

<h2>Mobilya (4×)</h2>
<div class="grid" id="furniture"></div>

<h2>Balonlar (4×, kare 0 / 1)</h2>
<div class="grid" id="bubbles"></div>

<h2>Araç ikonları (4×)</h2>
<div class="grid" id="icons"></div>

<script type="module" src="js/sprite-preview.js"></script>
</body>
</html>
